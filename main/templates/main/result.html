<!DOCTYPE html>

<head>

<body style="font-family: sans-serif; max-width: 500px; margin: 50px auto;">
    <h2>Natija</h2>

    <h3>Asl yozuv</h3>
    <audio controls src="{{ recording.original.url }}"></audio>

   {% if recording.cleaned %}
        <h3>Tozalangan yozuv</h3>

    {% else %}
        <p>Bu yozuv tozalanmagan.</p>
    {% endif %}
    
    <p><a href="{% url 'recordings' %}">Barcha yozuvlar</a></p>

    <p><a href="{% url 'home' %}">Yana yuklash</a></p>


</body>
