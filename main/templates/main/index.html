<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovoz tozalash</title>
</head>
<body style="font-family: sans-serif; max-width: 500px; margin: 50px auto;">
    <h2>Ovozdagi shovqinni tozalash</h2>
    <p>WAV yoki MP3 formatidagi fayllarni yuklang:</p>
    <form  method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="audio_file" accept="audio/*" required>
        <br><br>
        <button type="submit"> SHovqinni tozalash</button>
    </form>
</body>
</html>
